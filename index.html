<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flatmate Expense Manager</title>
  <meta name="description" content="Track and manage shared household expenses between flatmates" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flat Expenses" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ── Login ──────────────────────────────────────────────────────────────── -->
<div id="login-page" class="hidden">
  <div class="login-box">
    <div style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,rgba(59,130,246,0.2) 0%,rgba(37,99,235,0.05) 100%);border:1px solid rgba(59,130,246,0.3);color:var(--primary);margin-bottom:16px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="24" height="24">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div class="login-title">Flatmate Expenses</div>
    <div class="login-sub">Sign in to manage your shared expenses</div>
    <div id="login-error" class="alert alert-error hidden"></div>
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-username">Username</label>
        <input class="form-control" id="login-username" type="text" autocomplete="username" required placeholder="e.g. virendra" />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input class="form-control" id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary w-full" id="login-btn" style="margin-top:8px;padding:11px;">Sign In</button>
    </form>
  </div>
</div>

<!-- ── Change password dialog ─────────────────────────────────────────────── -->
<div id="change-pw-modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Change Password Required</span>
    </div>
    <div class="modal-body">
      <div class="alert alert-info mb-4">You must change your default password before continuing.</div>
      <div id="changepw-error" class="alert alert-error hidden"></div>
      <form id="changepw-form">
        <input type="text" name="username" autocomplete="username" style="display:none;" aria-hidden="true" value="" />
        <div class="form-group">
          <label class="form-label" for="cpw-current">Current Password</label>
          <input class="form-control" id="cpw-current" type="password" autocomplete="current-password" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="cpw-new">New Password</label>
          <input class="form-control" id="cpw-new" type="password" autocomplete="new-password" required minlength="6" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cpw-confirm">Confirm New Password</label>
          <input class="form-control" id="cpw-confirm" type="password" autocomplete="new-password" required minlength="6" />
        </div>
        <button type="submit" class="btn btn-primary w-full">Change Password</button>
      </form>
    </div>
  </div>
</div>

<!-- ── App Shell ──────────────────────────────────────────────────────────── -->
<div id="app-shell" class="hidden">
  <!-- Mobile Top Header -->
  <header id="mobile-header">
    <div class="mobile-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="22" height="22">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Flat Expenses</span>
    </div>
    <div class="mobile-actions">
      <button class="mobile-user-btn" onclick="navigate('profile')" aria-label="Profile">
        <span id="mobile-user-avatar">U</span>
      </button>
    </div>
  </header>

  <!-- Sidebar (Desktop) -->
  <nav id="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Flat Expenses
    </div>
    <div class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <div class="nav-section-label">Expenses</div>
      <button class="nav-item" data-page="personal" onclick="navigate('personal')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        My Expenses
      </button>
      <button class="nav-item" data-page="purchases-made" onclick="navigate('purchases-made')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Purchases I Made
      </button>
      <button class="nav-item" data-page="purchases-for-me" onclick="navigate('purchases-for-me')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Purchases For Me
      </button>
      <button class="nav-item" data-page="common" onclick="navigate('common')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        Common Expenses
      </button>
      <div class="nav-section-label">Money</div>
      <button class="nav-item" data-page="balances" onclick="navigate('balances')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        Balances
      </button>
      <button class="nav-item" data-page="repayments" onclick="navigate('repayments')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        Repayments
      </button>
      <div class="nav-section-label">Account</div>
      <button class="nav-item" data-page="profile" onclick="navigate('profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile &amp; UPI
      </button>
    </div>
    <div class="sidebar-user">
      <div class="name" id="sidebar-user-name">—</div>
      <div class="role" id="sidebar-user-role">—</div>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main id="main-content">
    <div id="page-dashboard"></div>
    <div id="page-personal" class="hidden"></div>
    <div id="page-purchases-made" class="hidden"></div>
    <div id="page-purchases-for-me" class="hidden"></div>
    <div id="page-common" class="hidden"></div>
    <div id="page-balances" class="hidden"></div>
    <div id="page-repayments" class="hidden"></div>
    <div id="page-profile" class="hidden"></div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav id="mobile-bottom-nav">
    <button class="mobile-nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="mobile-nav-item" data-page="personal" onclick="navigate('personal')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>My Exp</span>
    </button>
    <button class="mobile-nav-item" data-page="purchases-made" onclick="navigate('purchases-made')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span>Purchases</span>
    </button>
    <button class="mobile-nav-item" data-page="balances" onclick="navigate('balances')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      <span>Balances</span>
    </button>
    <button class="mobile-nav-item" id="mobile-menu-btn" onclick="toggleMobileDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Menu</span>
    </button>
  </nav>

  <!-- Mobile Slide-Up Drawer ("More" Sheet) -->
  <div id="mobile-drawer-backdrop" class="modal-backdrop hidden" onclick="toggleMobileDrawer(false)">
    <div id="mobile-drawer" class="mobile-drawer" onclick="event.stopPropagation()">
      <div class="bottom-sheet-handle"></div>
      <div class="drawer-header">
        <div class="drawer-user-info">
          <div class="drawer-user-name" id="drawer-user-name">—</div>
          <div class="drawer-user-role" id="drawer-user-role">—</div>
        </div>
        <button class="modal-close" onclick="toggleMobileDrawer(false)">×</button>
      </div>
      <div class="drawer-nav">
        <button class="drawer-nav-item" onclick="navigate('common');toggleMobileDrawer(false)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          Common Expenses
        </button>
        <button class="drawer-nav-item" onclick="navigate('purchases-for-me');toggleMobileDrawer(false)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          Purchases For Me
        </button>
        <button class="drawer-nav-item" onclick="navigate('repayments');toggleMobileDrawer(false)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
          Repayments &amp; History
        </button>
        <button class="drawer-nav-item" onclick="navigate('profile');toggleMobileDrawer(false)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Profile &amp; UPI
        </button>
        <div style="height:1px;background:var(--border);margin:8px 0;"></div>
        <button class="drawer-nav-item text-neg" onclick="logout();toggleMobileDrawer(false)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ── Toast container ───────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── Generic modal (reused) ───────────────────────────────────────────── -->
<div id="modal" class="modal-backdrop hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner">
    <div class="bottom-sheet-handle"></div>
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Modal</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ── Category Combobox Datalist ────────────────────────────────────────── -->
<datalist id="category-datalist"></datalist>

<!-- ── Frontend Application Scripts ──────────────────────────────────────── -->
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components/modal.js"></script>
<script src="/js/components/toast.js"></script>
<script src="/js/pages/dashboard.js"></script>
<script src="/js/pages/personal.js"></script>
<script src="/js/pages/purchases-made.js"></script>
<script src="/js/pages/purchases-for-me.js"></script>
<script src="/js/pages/common.js"></script>
<script src="/js/pages/balances.js"></script>
<script src="/js/pages/repayments.js"></script>
<script src="/js/pages/profile.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
